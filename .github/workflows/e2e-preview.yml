name: Preview E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Vercel preview deployment URL
        required: true
        type: string
      neon_branch_confirm:
        description: Type I_CONFIRM_NEON_BRANCH to confirm the preview uses a disposable Neon branch
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-results:
    if: inputs.neon_branch_confirm == 'I_CONFIRM_NEON_BRANCH'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url }}
      DATABASE_URL_TEST: ${{ secrets.NEON_TEST_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.NEON_TEST_DATABASE_URL }}
      ALLOW_TEST_DB_MUTATION: "1"
      # Hostname only (no credentials) so the pre-flight guard can refuse to
      # run the suites against the production database host.
      PRODUCTION_DATABASE_HOST: ${{ secrets.NEON_PRODUCTION_DATABASE_HOST }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require the disposable Neon branch secret
        run: test -n "$DATABASE_URL_TEST"
      - name: Require the production database hostname for the pre-flight guard
        run: test -n "$PRODUCTION_DATABASE_HOST"
      - name: Migrate the disposable test database
        run: npx drizzle-kit migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
      - run: npm run test:e2e
