name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pickem
      DATABASE_URL_TEST: ${{ secrets.NEON_TEST_DATABASE_URL }}
      ALLOW_TEST_DB_MUTATION: "1"
      # Hostname only (no credentials) so the pre-flight guard can refuse to
      # run the suites against the production database host.
      PRODUCTION_DATABASE_HOST: ${{ secrets.NEON_PRODUCTION_DATABASE_HOST }}
      BETTER_AUTH_SECRET: ci-only-not-a-production-secret
      BETTER_AUTH_URL: http://127.0.0.1:3000
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      UPSTASH_REDIS_REST_URL: https://example.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
      RATE_LIMIT_HASH_SECRET: ci-only-rate-limit-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrate the disposable test database
        if: env.DATABASE_URL_TEST != ''
        env:
          DATABASE_URL_DIRECT: ${{ secrets.NEON_TEST_DATABASE_URL }}
        run: npx drizzle-kit migrate
      - run: npm run test:integration
      - run: npm run build
