name: Preview E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Vercel preview deployment URL
        required: true
        type: string
      neon_branch_confirm:
        description: Type I_CONFIRM_NEON_BRANCH to confirm the preview uses a disposable Neon branch
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-results:
    if: inputs.neon_branch_confirm == 'I_CONFIRM_NEON_BRANCH'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url }}
      DATABASE_URL_TEST: ${{ secrets.NEON_TEST_DATABASE_URL }}
      ALLOW_TEST_DB_MUTATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require the disposable Neon branch secret
        run: test -n "$DATABASE_URL_TEST"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
      - run: npm run test:e2e
