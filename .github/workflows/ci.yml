name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pickem
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pickem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable database only. No Neon credentials or other secrets are used.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/pickem
      DATABASE_URL_TEST: postgresql://ci:ci@127.0.0.1:5432/pickem
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@127.0.0.1:5432/pickem
      ALLOW_TEST_DB_MUTATION: "1"
      # Non-target placeholder so the pre-flight guard has a production host to
      # compare against without exposing a real database.
      PRODUCTION_DATABASE_HOST: production.invalid
      BETTER_AUTH_SECRET: ci-only-not-a-production-secret
      BETTER_AUTH_URL: http://127.0.0.1:3000
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      UPSTASH_REDIS_REST_URL: https://example.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
      RATE_LIMIT_HASH_SECRET: ci-only-rate-limit-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrate the disposable test database
        run: npx drizzle-kit migrate
      - run: npm run test:integration
      - run: npm run build
      - name: Install the end-to-end browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
